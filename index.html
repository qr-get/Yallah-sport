    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #ffffff;
            --soft-white: rgba(255,255,255,0.88);
            --turquoise: #43e4d0;
            --blue: #38bdf8;
            --dark: #062c3d;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 15px 50px;

            position: relative;
            overflow-x: hidden;

            background: #062c3d;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: -5%;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 35, 55, 0.12),
                    rgba(0, 30, 45, 0.38),
                    rgba(0, 18, 30, 0.76)
                ),
                url("background.jpg")
                center center /
                cover no-repeat;

            z-index: -3;

            animation:
                backgroundZoom
                50s
                ease-in-out
                infinite alternate;

            will-change: transform;
        }

        @keyframes backgroundZoom {

            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.07);
            }
        }


        /* =====================================================
           SOFT OVERLAY
        ===================================================== */

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 30, 45, 0.08),
                    rgba(0, 20, 35, 0.20),
                    rgba(0, 10, 20, 0.55)
                );

            z-index: -2;

            pointer-events: none;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: 100%;
            max-width: 470px;

            text-align: center;

            position: relative;
            z-index: 5;

            animation: pageAppear 1.2s ease;
        }

        @keyframes pageAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }



        /* =====================================================
           KITE ICON
        ===================================================== */

        .kite-icon {

            width: 55px;
            height: 55px;

            margin: 0 auto 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.13);

            border:
                1px solid rgba(255,255,255,0.30);

            backdrop-filter: blur(10px);

            animation:
                softFloat
                5s
                ease-in-out
                infinite;
        }

        .kite-icon i {

            font-size: 22px;

            color: white;

            opacity: 0.95;
        }

        @keyframes softFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            width: 150px;
            height: 150px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                rgba(255,255,255,0.94);

            border:
                4px solid rgba(255,255,255,0.95);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.28);

            overflow: hidden;
        }

        .logo img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 7px;

            display: block;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .title {

            font-family:
                "Montserrat",
                "Cairo",
                sans-serif;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: 2px;

            text-shadow:
                0 4px 20px
                rgba(0,0,0,0.35);

            margin-bottom: 4px;
        }


        /* =====================================================
           LOCATION
        ===================================================== */

        .location {

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            font-size: 13px;

            color:
                rgba(255,255,255,0.88);

            margin-bottom: 7px;
        }

        .location i {

            color:
                var(--turquoise);

            font-size: 13px;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .subtitle {

            font-size: 12px;

            font-weight: 400;

            color:
                rgba(255,255,255,0.72);

            margin-bottom: 24px;
        }


        /* =====================================================
           LINKS
        ===================================================== */

        .links {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .link {

            min-height: 57px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 12px 55px;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid rgba(255,255,255,0.22);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            box-shadow:
                0 7px 25px
                rgba(0,0,0,0.16);

            transition:
                all 0.35s ease;

            overflow: hidden;
        }


        /* خط ناعم داخل الزر */

        .link::after {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 3px;
            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    var(--turquoise),
                    var(--blue)
                );

            opacity: 0;

            transition:
                opacity 0.3s ease;
        }


        .link:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,0.18);

            border-color:
                rgba(255,255,255,0.38);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.25);
        }

        .link:hover::after {
            opacity: 1;
        }


        .link:active {
            transform: scale(0.98);
        }


        /* =====================================================
           MAIN ICON
        ===================================================== */

        .main-icon {

            position: absolute;

            right: 20px;

            font-size: 19px;

            width: 25px;

            text-align: center;
        }


        /* =====================================================
           ARROW
        ===================================================== */

        .arrow {

            position: absolute;

            left: 20px;

            font-size: 10px;

            opacity: 0.55;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .link:hover .arrow {

            transform:
                translateX(-4px);

            opacity: 0.9;
        }


        /* =====================================================
           LTR
        ===================================================== */

        html[dir="ltr"] .main-icon {

            right: auto;
            left: 20px;
        }

        html[dir="ltr"] .arrow {

            left: auto;
            right: 20px;
        }

        html[dir="ltr"] .link:hover .arrow {

            transform:
                translateX(4px);
        }


        /* =====================================================
           ICON COLORS
        ===================================================== */

        .facebook .main-icon {
            color: #1877f2;
        }

        .instagram .main-icon {
            color: #ff5b9f;
        }

        }

        }

        .language-switcher{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 18px;direction:ltr}
        .lang-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:76px;height:38px;padding:6px 10px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.10);color:#fff;font-family:"Cairo",sans-serif;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.25s}
        .lang-btn:hover,.lang-btn.active{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.42);transform:translateY(-2px)}
        .lang-btn .flag{font-size:17px;line-height:1}
        @media(max-width:500px){.language-switcher{gap:6px}.lang-btn{min-width:68px;height:35px;font-size:11px}.lang-btn .flag{font-size:15px}}

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            margin-top: 22px;

            font-size: 10px;

            color:
                rgba(255, 255, 255, 0.55);
        }


        /* =====================================================
           SMALL DECORATION
        ===================================================== */

        .bottom-line {

            width: 45px;
            height: 2px;

            margin: 13px auto 0;

            border-radius: 10px;

            background:

                    transparent,
                    var(--turquoise),
                    transparent
                );

            opacity: 0.75;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            body {

            }

            .page {

            }

            }

            .link {

                border-radius: 14px;

                font-size: 13px;
            }

            .main-icon {
                right: 17px;
            }

            .arrow {
                left: 17px;
            }

            html[dir="ltr"] .main-icon {
                right: auto;
                left: 17px;
            }

            html[dir="ltr"] .arrow {
                left: auto;
                right: 17px;
            }
        }


        /* =====================================================
           SMALL DEVICES
        ===================================================== */

        @media (max-width: 360px) {

            body {
                padding-top: 12px;
            }

            .kite-icon {

                height: 48px;
            }

            .logo {

                height: 110px;
            }

            }

                min-height: 52px;

                font-size: 12px;
            }
        }


        /* =====================================================
           REDUCE MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;
            }
        }

        function detectLanguage() {
            const languages = [
                ...(navigator.languages || []),
                navigator.language || navigator.userLanguage || "en"
            ];

            for (const browserLang of languages) {
                const lang = browserLang.toLowerCase();

                if (lang.startsWith("ar")) return "ar";
                if (lang.startsWith("fr")) return "fr";
                if (lang.startsWith("sl")) return "sl";
                if (lang.startsWith("de")) return "de";
                if (lang.startsWith("ru")) return "ru";
                if (lang.startsWith("en")) return "en";
            }

            return "en";
        }

        function applyLanguage(lang = detectLanguage()) {
            const t = translations[lang] || translations.en;

            document.getElementById("title").textContent = t.title;
            document.getElementById("location").textContent = t.location;
            document.getElementById("subtitle").textContent = t.subtitle;

            const footer = document.getElementById("footer");
            if (footer) {
                footer.firstChild.textContent = t.footer;
            }

            document.querySelectorAll("[data-key]").forEach(element => {
                const key = element.getAttribute("data-key");

                if (t[key]) {
                    element.textContent = t[key];
                }
            });

            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

            // Save the detected language for the current device.
            try {
                localStorage.setItem("preferredLanguage", lang);
            } catch (e) {}
        }

        // Apply language and update active button
        function setActiveLanguageButton(lang) {
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });

            document.getElementById("location").textContent = t.location;

            if (footer) {
                const firstTextNode = Array.from(footer.childNodes)
                    .find(node => node.nodeType === Node.TEXT_NODE);
                if (firstTextNode) firstTextNode.textContent = t.footer;
            }

            document.querySelectorAll("[data-key]").forEach(element => {
                const key = element.getAttribute("data-key");
                if (t[key]) {
                    element.textContent = t[key];
                }
            });

            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

            setActiveLanguageButton(lang);

            try {
                localStorage.setItem("preferredLanguage", lang);
            } catch (e) {}
        }

        // Manual language buttons
        document.querySelectorAll(".lang-btn").forEach(button => {
            button.addEventListener("click", () => {
                const lang = button.dataset.lang;
                if (translations[lang]) {
                    applyLanguage(lang);
                }
            });
        });

        // Automatically detect the mobile/browser language on first load.
        let initialLanguage = null;
        try {
            initialLanguage = localStorage.getItem("preferredLanguage");
        } catch (e) {}

        // Use saved language only if it exists; otherwise detect device/browser language.
        applyLanguage(
            initialLanguage && translations[initialLanguage]
                ? initialLanguage
                : detectLanguage()
        );

        // If the device language changes while the page is open, update it.
        window.addEventListener("languagechange", () => {
            let savedLanguage = null;
            try {
                savedLanguage = localStorage.getItem("preferredLanguage");
            } catch (e) {}

            if (!savedLanguage) {
                applyLanguage(detectLanguage());
            }
        });
    </script>

</body>

</html>
