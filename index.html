<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --white:#ffffff;

    --turquoise:#43e4d0;

    --blue:#38bdf8;

    --dark:#062c3d;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:"Cairo",sans-serif;

    color:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px 14px 45px;

    position:relative;

    overflow-x:hidden;

    background:#062c3d;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:-6%;

    background:

        linear-gradient(
            180deg,
            rgba(0,35,55,.08),
            rgba(0,30,45,.35),
            rgba(0,15,25,.78)
        ),

        url("background.jpg")

        center center /
        cover
        no-repeat;

    z-index:-3;

    animation:
        backgroundZoom
        55s
        ease-in-out
        infinite
        alternate;

    will-change:transform;
}

@keyframes backgroundZoom{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }

}


/* =====================================================
   OVERLAY
===================================================== */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(67,228,208,.10),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            rgba(0,25,40,.08),
            rgba(0,10,20,.48)
        );

    z-index:-2;

    pointer-events:none;
}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:100%;

    max-width:470px;

    text-align:center;

    position:relative;

    z-index:5;

    animation:
        pageAppear
        1.1s
        ease;
}

@keyframes pageAppear{

    from{

        opacity:0;

        transform:
            translateY(25px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }

}


/* =====================================================
   KITE ICON
===================================================== */

.kite-icon{

    width:54px;

    height:54px;

    margin:
        0 auto 12px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:50%;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.30);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.15);

    animation:
        softFloat
        5s
        ease-in-out
        infinite;
}

.kite-icon i{

    font-size:22px;

    color:#fff;
}

@keyframes softFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:155px;

    height:155px;

    margin:
        0 auto 18px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(255,255,255,.96);

    border:
        4px solid
        rgba(255,255,255,.96);

    box-shadow:

        0 15px 45px
        rgba(0,0,0,.30),

        0 0 0 7px
        rgba(255,255,255,.08);

    overflow:hidden;

    animation:
        logoAppear
        1s
        ease;
}

.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    padding:5px;

    display:block;
}

@keyframes logoAppear{

    from{

        opacity:0;

        transform:
            scale(.75);
    }

    to{

        opacity:1;

        transform:
            scale(1);
    }

}


/* =====================================================
   TITLE
===================================================== */

.title{

    font-family:
        "Montserrat",
        "Cairo",
        sans-serif;

    font-size:30px;

    font-weight:800;

    letter-spacing:2px;

    margin-bottom:4px;

    text-shadow:
        0 4px 20px
        rgba(0,0,0,.40);
}


/* =====================================================
   LOCATION
===================================================== */

.location{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    font-size:13px;

    color:
        rgba(255,255,255,.90);

    margin-bottom:6px;
}

.location i{

    color:
        var(--turquoise);
}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

    font-size:12px;

    color:
        rgba(255,255,255,.74);

    margin-bottom:20px;
}


/* =====================================================
   LANGUAGE SWITCHER
===================================================== */

.language-switcher{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:18px;

    direction:ltr;
}

.lang-btn{

    min-width:72px;

    height:36px;

    padding:
        5px 9px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(255,255,255,.10);

    color:#fff;

    font-family:
        "Cairo",
        sans-serif;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    transition:.25s ease;
}

.lang-btn:hover,
.lang-btn.active{

    background:
        rgba(255,255,255,.22);

    border-color:
        rgba(255,255,255,.45);

    transform:
        translateY(-2px);

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.15);
}

.lang-btn .flag{

    font-size:16px;
}


/* =====================================================
   LINKS
===================================================== */

.links{

    display:flex;

    flex-direction:column;

    gap:10px;
}

.link{

    min-height:57px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        12px 55px;

    color:#fff;

    text-decoration:none;

    font-size:14px;

    font-weight:600;

    border-radius:16px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.22);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.16);

    transition:

        transform .3s ease,

        background .3s ease,

        border-color .3s ease,

        box-shadow .3s ease;

    overflow:hidden;
}


/* SHINE */

.link::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.07),
            transparent
        );

    transform:
        translateX(-100%);

    transition:
        transform .6s ease;
}

.link:hover::before{

    transform:
        translateX(100%);
}


/* SIDE LINE */

.link::after{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:3px;

    height:100%;

    background:

        linear-gradient(
            180deg,
            var(--turquoise),
            var(--blue)
        );

    opacity:0;

    transition:.3s;
}

.link:hover{

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.18);

    border-color:
        rgba(255,255,255,.38);

    box-shadow:
        0 13px 32px
        rgba(0,0,0,.26);
}

.link:hover::after{

    opacity:1;
}

.link:active{

    transform:
        scale(.98);
}


/* =====================================================
   ICONS
===================================================== */

.main-icon{

    position:absolute;

    right:20px;

    width:25px;

    text-align:center;

    font-size:19px;
}

.arrow{

    position:absolute;

    left:20px;

    font-size:10px;

    opacity:.55;

    transition:.3s;
}

.link:hover .arrow{

    transform:
        translateX(-4px);

    opacity:.95;
}


/* =====================================================
   LTR
===================================================== */

html[dir="ltr"] .main-icon{

    right:auto;

    left:20px;
}

html[dir="ltr"] .arrow{

    left:auto;

    right:20px;
}

html[dir="ltr"] .link:hover .arrow{

    transform:
        translateX(4px);
}


/* =====================================================
   ICON COLORS
===================================================== */

.facebook .main-icon{

/* =====================================================

===================================================== */

.footer a{

.footer a:hover{

/* =====================================================
   BOTTOM LINE
===================================================== */

.bottom-line{

    width:50px;

    height:2px;

    border-radius:10px;

    background:

/* =====================================================
   MOBILE
===================================================== */

    .link{

    .main-icon{

/* =====================================================

/* =====================================================

===================================================== */

@media(prefers-reduced-motion:reduce){

    *::after{

}

/* =====================================================
   LANGUAGE DETECTION
===================================================== */

function detectLanguage(){

    const languages=[

        ...(navigator.languages || []),

        navigator.language || "en"

    ];


    for(
        const browserLang
        of languages
    ){

        const lang=
            browserLang.toLowerCase();


        if(
            lang.startsWith("ar")
        )
            return "ar";


        if(
            lang.startsWith("fr")
        )
            return "fr";


        if(
            lang.startsWith("sl")
        )
            return "sl";


        if(
            lang.startsWith("de")
        )
            return "de";


        if(
            lang.startsWith("en")
        )
            return "en";

    }


    return "en";
}

    document

                "active",

                btn.dataset.lang===lang

            );

        });

}

    document
        .getElementById("subtitle")
        .textContent=
        t.subtitle;


    document
        .querySelectorAll("[data-key]")
        .forEach(element=>{

            const key=
                element.dataset.key;


            if(t[key]){

                element.textContent=
                    t[key];

            }

        });


    const footer=
        document.getElementById("footer");


    if(footer){

        const textNode=
            Array.from(
                footer.childNodes
            )
            .find(
                node=>
                    node.nodeType===
                    Node.TEXT_NODE
            );


        if(textNode){

            textNode.textContent=
                "\n        "
                +
                t.footer
                +
                "\n        ";

        }

    }


    document.documentElement.lang=
        lang;


    document.documentElement.dir=
        lang==="ar"
            ? "rtl"
            : "ltr";


    setActiveLanguageButton(lang);


    try{

        localStorage.setItem(
            "preferredLanguage",
            lang
        );

    }catch(e){}

}


/* =====================================================
   LANGUAGE BUTTONS
===================================================== */

document
    .querySelectorAll(".lang-btn")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                const lang=
                    button.dataset.lang;


                if(
                    translations[lang]
                ){

                    applyLanguage(
                        lang
                    );

                }

            }
        );

    });


/* =====================================================
   INITIAL LANGUAGE
===================================================== */

let initialLanguage=null;


try{

    initialLanguage=
        localStorage.getItem(
            "preferredLanguage"
        );

}catch(e){}


applyLanguage(

    initialLanguage
    &&
    translations[initialLanguage]

        ? initialLanguage

        : detectLanguage()

);


/* =====================================================
   LANGUAGE CHANGE
===================================================== */

window.addEventListener(
    "languagechange",
    ()=>{

        let savedLanguage=null;


        try{

            savedLanguage=
                localStorage.getItem(
                    "preferredLanguage"
                );

        }catch(e){}


        if(!savedLanguage){

            applyLanguage(
                detectLanguage()
            );

        }

    }
);


/* =====================================================
   EMAIL SYSTEM
===================================================== */

function openEmail(email){

    /*
     * ===============================
     * MOBILE
     * ===============================
     */

    if(window.innerWidth <= 768){

        const mailto=
            "mailto:"
            +
            email
            +
            "?subject="
            +
            encodeURIComponent(
                "YALLAH SPORT"
            );


        /*
         * فتح تطبيق البريد
         */

        window.location.href=
            mailto;


        /*
         * Fallback إلى Gmail
         */

        setTimeout(
            function(){

                window.location.href=
                    "https://mail.google.com/mail/?view=cm&fs=1&tf=1&to="
                    +
                    encodeURIComponent(email)
                    +
                    "&su="
                    +
                    encodeURIComponent(
                        "YALLAH SPORT"
                    );

            },
            1500
        );


        return;

    }


    /*
     * ===============================
     * DESKTOP
     * ===============================
     */


    const gmailURL=

        "https://mail.google.com/mail/?view=cm&fs=1&tf=1&to="
        +
        encodeURIComponent(email)
        +
        "&su="
        +
        encodeURIComponent(
            "YALLAH SPORT"
        );


    /*
     * فتح Gmail Compose
     */

    window.open(
        gmailURL,
        "_blank",
        "noopener,noreferrer"
    );

}
